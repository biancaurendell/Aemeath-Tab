<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel New Tab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <img class="custom-background" id="customBackground" alt="" aria-hidden="true" />
    <div class="dust-overlay" aria-hidden="true"></div>
    <canvas id="meteorCanvas" aria-hidden="true"></canvas>

    <main class="new-tab" id="app">
      <div class="pixel-decor decor-top-left" aria-hidden="true"></div>
      <div class="pixel-decor decor-top-right" aria-hidden="true"></div>
      <div class="pixel-decor decor-mid-left" aria-hidden="true"></div>
      <div class="pixel-decor decor-mid-right" aria-hidden="true"></div>

      <button class="icon-button settings-trigger" id="settingsButton" type="button" aria-label="打开设置">
        <span aria-hidden="true">⚙</span>
      </button>

      <section class="center-stage" aria-label="新标签页搜索">
        <div class="clock-panel" id="clockPanel">
          <time class="pixel-time" id="timeText" aria-label="00:00:00"></time>
          <div class="date" id="dateText">4月28日 星期二</div>
        </div>

        <form class="search-bar" id="searchForm" autocomplete="off">
          <div class="engine-picker" id="enginePicker">
            <span class="engine-dot" id="engineDot">G</span>
            <button class="engine-button" id="engineButton" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="engineName">GOOGLE</span>
              <span aria-hidden="true">⌄</span>
            </button>
            <div class="engine-menu" id="engineMenu" role="listbox" aria-label="选择搜索引擎"></div>
          </div>
          <input id="searchInput" name="q" type="search" placeholder="输入搜索内容" autofocus />
          <button class="search-submit" type="submit" aria-label="搜索">
            <span aria-hidden="true">⌕</span>
          </button>
        </form>
      </section>

      <section class="shortcut-row" id="shortcutRow" aria-label="快捷入口">
        <button class="shortcut add-shortcut" id="addShortcutButton" type="button" aria-label="添加图标">
          <span class="shortcut-icon">＋</span>
          <span>添加图标</span>
        </button>
      </section>

      <div class="shortcut-menu" id="shortcutMenu" role="menu" aria-hidden="true">
        <button type="button" data-action="open" role="menuitem">打开</button>
        <button type="button" data-action="edit" role="menuitem">修改</button>
        <button type="button" data-action="delete" role="menuitem">删除</button>
      </div>

      <button class="pet-sprite" id="petSprite" type="button" aria-label="主页小角色">
        <img id="petImage" src="./assets/pet/move.gif" alt="" draggable="false" />
      </button>

      <section class="music-player" id="musicPlayer" aria-label="音乐播放窗口">
        <div class="music-note-layer" aria-hidden="true">
        </div>
        <div class="mini-spectrum" id="miniSpectrum" aria-hidden="true"></div>
        <div class="track-title" id="trackTitle">网易云音乐 / 粘贴音频链接</div>
        <div class="track-subtitle" id="trackSubtitle">Meting Playlist</div>
        <div class="playlist-panel" id="playlistPanel" aria-label="网易云歌单"></div>
        <div class="music-controls">
          <button id="musicPrevButton" type="button" aria-label="上一首">◀</button>
          <button id="musicPlayButton" type="button" aria-label="播放或暂停">▶</button>
          <button id="musicNextButton" type="button" aria-label="下一首">▶</button>
          <button id="neteaseButton" type="button" aria-label="打开网易云">☰</button>
        </div>
        <audio id="musicAudio" preload="metadata"></audio>
      </section>
      <button class="music-collapse" id="musicCollapseButton" type="button" aria-label="收起音乐窗口">♪</button>

      <div class="bottom-spectrum" id="bottomSpectrum" aria-hidden="true"></div>
      <div class="bottom-notes" aria-hidden="true">
      </div>

      <div class="pixel-ground" aria-hidden="true">
        <div class="cloud cloud-a"></div>
        <div class="cloud cloud-b"></div>
        <div class="cloud cloud-c"></div>
      </div>
    </main>

    <dialog class="settings-dialog" id="settingsDialog">
      <form method="dialog" class="settings-card">
        <header class="settings-header">
          <h2>设置</h2>
          <button class="icon-button" value="close" aria-label="关闭设置">×</button>
        </header>

        <label class="setting-line">
          <span>
            <strong>显示时间</strong>
            <small>控制中央像素时钟是否展示</small>
          </span>
          <input id="clockToggle" type="checkbox" role="switch" checked />
        </label>

        <label class="setting-line">
          <span>
            <strong>显示图标</strong>
            <small>控制整排网址快捷图标是否展示</small>
          </span>
          <input id="addShortcutToggle" type="checkbox" role="switch" checked />
        </label>

        <label class="setting-line">
          <span>
            <strong>搜索新标签页打开</strong>
            <small>关闭时在当前页面打开搜索结果</small>
          </span>
          <input id="searchNewTabToggle" type="checkbox" role="switch" />
        </label>

        <label class="setting-block">
          <span>
            <strong>上传背景</strong>
            <small>选择一张本地图片作为背景</small>
          </span>
          <input id="backgroundFile" type="file" accept="image/*" />
        </label>

        <label class="setting-block">
          <span>
            <strong>背景图片 URL</strong>
            <small>粘贴可访问的图片地址</small>
          </span>
          <input id="backgroundUrl" type="url" placeholder="https://example.com/bg.png" />
        </label>

        <label class="setting-block">
          <span>
            <strong>音乐链接</strong>
            <small>粘贴可直接播放的 mp3/ogg 地址，或打开网易云寻找音乐</small>
          </span>
          <input id="musicUrl" type="url" placeholder="https://example.com/music.mp3" />
        </label>

        <label class="setting-block">
          <span>
            <strong>Meting 歌单 API</strong>
            <small>粘贴自定义 Meting 歌单接口，页面会展示歌单并支持选择歌曲播放</small>
          </span>
          <input id="metingApiUrl" type="url" placeholder="https://api.injahow.cn/meting/?server=netease&type=playlist&id=17929070065" />
        </label>

        <label class="setting-block">
          <span>
            <strong>导入本地音乐</strong>
            <small>选择本地 mp3/ogg/wav 文件，立即在右下角播放器里播放</small>
          </span>
          <input id="musicFile" type="file" accept="audio/*" />
        </label>

        <div class="setting-ranges">
          <label class="range-line">
            <span>图标透明度</span>
            <input id="iconOpacity" type="range" min="35" max="100" value="100" />
          </label>
          <label class="range-line">
            <span>图标大小</span>
            <input id="iconScale" type="range" min="70" max="140" value="100" />
          </label>
          <label class="range-line">
            <span>时间透明度</span>
            <input id="timeOpacity" type="range" min="35" max="100" value="100" />
          </label>
          <label class="range-line">
            <span>时间大小</span>
            <input id="timeScale" type="range" min="70" max="140" value="100" />
          </label>
          <label class="range-line">
            <span>搜索框透明度</span>
            <input id="searchOpacity" type="range" min="35" max="100" value="100" />
          </label>
          <label class="range-line">
            <span>搜索框大小</span>
            <input id="searchScale" type="range" min="75" max="130" value="100" />
          </label>
          <label class="range-line">
            <span>时间横向位置</span>
            <input id="timeX" type="range" min="-40" max="40" value="0" />
          </label>
          <label class="range-line">
            <span>时间纵向位置</span>
            <input id="timeY" type="range" min="-40" max="40" value="0" />
          </label>
          <label class="range-line">
            <span>搜索框横向位置</span>
            <input id="searchX" type="range" min="-40" max="40" value="0" />
          </label>
          <label class="range-line">
            <span>搜索框纵向位置</span>
            <input id="searchY" type="range" min="-40" max="40" value="0" />
          </label>
        </div>

        <div class="settings-actions">
          <button class="text-button" id="applyUrlButton" type="button">应用 URL</button>
          <button class="text-button" id="applyMusicButton" type="button">应用音乐</button>
          <button class="text-button" id="loadPlaylistButton" type="button">加载歌单</button>
          <button class="text-button ghost" id="resetBackgroundButton" type="button">恢复默认</button>
        </div>

        <div class="settings-actions">
          <button class="text-button" id="exportConfigButton" type="button">导出配置</button>
          <button class="text-button ghost" id="importConfigButton" type="button">导入配置</button>
          <input id="importConfigFile" class="visually-hidden" type="file" accept="application/json,.json" />
        </div>
      </form>
    </dialog>

    <dialog class="shortcut-dialog" id="shortcutDialog">
      <form class="shortcut-card" id="shortcutForm" method="dialog">
        <header class="shortcut-header">
          <h2 id="shortcutDialogTitle">添加网址快捷方式</h2>
          <button class="round-close" id="closeShortcutDialogButton" type="button" aria-label="关闭添加图标">×</button>
        </header>

        <div class="form-grid with-action">
          <label>
            <span>地址</span>
            <input id="shortcutUrl" type="url" placeholder="https://" required />
          </label>
          <button class="dark-button" id="fetchIconButton" type="button">获取图标</button>
        </div>

        <label class="form-grid">
          <span>名称</span>
          <input id="shortcutName" type="text" placeholder="网站名称" maxlength="18" required />
        </label>

        <fieldset class="color-field">
          <legend>图标颜色</legend>
          <div class="color-swatches" id="colorSwatches"></div>
        </fieldset>

        <label class="form-grid">
          <span>图标文字</span>
          <input id="shortcutIconText" type="text" value="A" maxlength="2" />
        </label>

        <div class="form-grid with-action">
          <label>
            <span>键盘快捷键</span>
            <input id="shortcutKey" type="text" placeholder="点击后按下快捷键，例如 Ctrl+1" readonly />
          </label>
          <button class="dark-button" id="clearShortcutKeyButton" type="button">清空快捷键</button>
        </div>

        <div class="icon-mode-row">
          <label class="icon-mode active" id="textIconMode">
            <input type="radio" name="iconMode" value="text" checked />
            <span class="icon-preview" id="textIconPreview">A</span>
            <strong>文字图标</strong>
          </label>
          <label class="icon-mode">
            <input id="iconUpload" type="file" accept="image/*" />
            <span class="icon-preview upload-preview" id="uploadIconPreview">＋</span>
            <strong>上传</strong>
          </label>
        </div>

        <div class="shortcut-actions">
          <button class="text-button" id="saveShortcutButton" type="submit" value="save">保存</button>
          <button class="text-button ghost" id="saveMoreShortcutButton" type="button">保存并继续</button>
          <button class="text-button ghost" id="cancelShortcutButton" type="button">取消</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
